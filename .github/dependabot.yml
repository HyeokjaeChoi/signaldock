# Issue 41 (ADR-0024). Weekly, grouped by blast radius, few open PRs.
# Limit: Dependabot reads a Gradle version catalog only at `gradle/libs.versions.toml` of the
# update directory, and the SignalDock catalog is at the repo root, outside every Gradle build
# directory. The gradle entries below therefore see build-file literals only (none today).
# Catalog versions are bumped by hand (docs/releases/README.md, ADR-0024).
version: 2
updates:
  # SDK runtime dependencies are in the published POM; consumers resolve them.
  - package-ecosystem: gradle
    directory: /sdk
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      sdk-consumer-facing:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*", "androidx.room*", "androidx.work*", "com.squareup*"]
      build-and-test:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /server
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      server:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /compatibility/consumer-android
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      build-and-test:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /contract-check
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      build-and-test:
        patterns: ["*"]
  # Web: both packages are private and use exact pins; they ship in the Docker image or a static report.
  - package-ecosystem: npm
    directories: [/dashboard, /perf/report]
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    # Node types follow the Node 24 runtime line (TOOLCHAIN.md); a new major is a manual decision.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-build-and-test:
        dependency-type: development
      npm-runtime:
        dependency-type: production
  # CI and build images (digest-pinned in Dockerfiles and Compose).
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/server, /dashboard]
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    # Runtime majors (JDK 21 LTS, Node 24 LTS) are pinned in TOOLCHAIN.md; a new major is a manual decision.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 1
    # A PostgreSQL major cannot read the old data directory; it needs a dump and restore (manual).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]
