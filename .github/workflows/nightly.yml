# Nightly tier of the quality gates (ADR-0049 decision 1; plan: .scratch/quality-gates/spec.md).
# A failure here blocks no PR. It fails the run, and the owner triages it into .scratch/. The release workflows
# need the last run of this file on the tagged commit to be `success` (gate D4, ticket 12).
# No retry anywhere (ADR-0049 decision 5): a flaky gate is fixed at its cause.
#
# Rules for every job in this file (checked by scripts/check-repo-rules.sh):
#   - the job runs scripts/nightly-summary.py in a step with `if: always()` and uploads the folder as the artifact
#     `nightly-summary-<job>` (gate Q2; format: docs/engineering/nightly-summary.md);
#   - the file triggers only on `schedule` and `workflow_dispatch`.
# Also set `timeout-minutes` on each job, and pin every action by a 40-character SHA.
name: nightly

on:
  push:
    branches: ['claude/gate-05-nightly-3db1f6']  # TEMP proof trigger, removed before merge
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate Q1: scripts/e2e-delivery.sh cases 1-5 against the Compose stack and an API 34 x86_64 emulator (ADR-0010, ADR-0023).
  # The KVM and emulator setup is the one of the `device-test` job in repo-rules.yml, with the same AVD cache key.
  e2e-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_RESULT_JSON: ${{ github.workspace }}/e2e-cases.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: scripts/setup-toolchain.sh
      - run: echo "JAVA_HOME=$PWD/.tools/$(ls .tools | grep '^jdk-')" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Same key as `device-test` (same API level, target, and arch). Change both when one changes.
      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1
      - name: Create AVD and snapshot (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Compose stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          # The Dashboard container has no healthcheck; the E2E script needs it reachable.
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused -o /dev/null http://127.0.0.1:5173/
      - name: e2e-delivery.sh cases 1-5
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: scripts/e2e-delivery.sh 1 2 3 4 5
      - name: Summary (gate Q2)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 -I scripts/nightly-summary.py --job e2e-delivery --gate Q1 --status "$JOB_STATUS" --cases e2e-cases.json --number emulatorApi=34
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-summary-e2e-delivery
          path: nightly-summary/
          if-no-files-found: error
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail=300 > compose.log
      - name: Upload Compose logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-delivery-compose-logs
          path: compose.log
          if-no-files-found: ignore

  # ---- Add jobs below this line, one ticket at a time, after the PR of ticket 05 has merged. ----
  # Planned (spec "Tickets"): 06 Android durability and power loss (A5, A6, A4), 07 iOS durability (I2),
  # 08 ingest load SLO (B3), 11 OSV-Scanner on main and the ruleset drift check (R2, R3), and the Lighthouse run (W5).
  # Copy the summary and upload steps of `e2e-delivery`; `python3 -I scripts/nightly-summary.py` documents its flags.
