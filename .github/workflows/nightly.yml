# Nightly tier of the quality gates (ADR-0049 decision 1; plan: .scratch/quality-gates/spec.md).
# A failure here blocks no PR. It fails the run, and the owner triages it into .scratch/. The release workflows
# need the last run of this file on the tagged commit to be `success` (gate D4, scripts/check-nightly-green.sh).
# No retry anywhere (ADR-0049 decision 5): a flaky gate is fixed at its cause.
#
# Rules for every job in this file (checked by scripts/check-repo-rules.sh):
#   - the job runs scripts/nightly-summary.py in a step with `if: always()` and uploads the folder as the artifact
#     `nightly-summary-<job>` (gate Q2; format: docs/engineering/nightly-summary.md). The check reads the script name and
#     the artifact name in the job; `if: always()` is a convention it does not read;
#   - the file triggers only on `schedule` and `workflow_dispatch`.
# Also set `timeout-minutes` on each job, and pin every action by a 40-character SHA.
name: nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate Q1: scripts/e2e-delivery.sh cases 1-5 against the Compose stack and an API 34 x86_64 emulator (ADR-0010, ADR-0023).
  # The KVM and emulator setup is the one of the `device-test` job in repo-rules.yml, with the same AVD cache key.
  e2e-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_RESULT_JSON: ${{ github.workspace }}/e2e-cases.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: for d in "$PWD"/.tools/jdk-*; do echo "JAVA_HOME=$d" >> "$GITHUB_ENV"; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Same key as `device-test` (same API level, target, and arch). Change both when one changes.
      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1
      - name: Create AVD and snapshot (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Compose stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          # The Dashboard container has no healthcheck; the E2E script needs it reachable.
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused -o /dev/null http://127.0.0.1:5173/
      - name: e2e-delivery.sh cases 1-5
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: scripts/e2e-delivery.sh 1 2 3 4 5
      - name: Summary (gate Q2)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 -I scripts/nightly-summary.py --job e2e-delivery --gate Q1 --status "$JOB_STATUS" --cases e2e-cases.json --number emulatorApi=34
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-summary-e2e-delivery
          path: nightly-summary/
          if-no-files-found: error
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail=300 > compose.log
      - name: Upload Compose logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-delivery-compose-logs
          path: compose.log
          if-no-files-found: ignore

  # Gates A5, A6, A4 (ADR-0049 decisions 2, 5, 6): scripts/device-durability.sh, all cases, on x86_64 google_apis emulators at
  # API 24 and 37.0 (the newest stable x86_64 image). `powerloss` kills the emulator process and cold-boots it. The AVD setup is
  # the one of `device-test` with the API level in the cache key.
  device-durability:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: ['24', '37.0']
    env:
      DURABILITY_RESULT_JSON: ${{ github.workspace }}/durability-cases.json
      DURABILITY_NUMBERS: ${{ github.workspace }}/durability-numbers.txt
      # The options of the emulator restart in case `powerloss`: those of the run step, without the snapshot options.
      EMULATOR_OPTS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: for d in "$PWD"/.tools/jdk-*; do echo "JAVA_HOME=$d" >> "$GITHUB_ENV"; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Restore only: the save step below runs right after the AVD is created, before `powerloss` kills and cold-boots the
      # emulator, so the cached snapshot is never one of a cold-booted AVD.
      - name: AVD cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api }}-google_apis-x86_64-v1
      - name: Create AVD and snapshot (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Save AVD cache (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api }}-google_apis-x86_64-v1
      - name: device-durability.sh
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: scripts/device-durability.sh emulator-5554
      - name: Summary (gate Q2)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          API: ${{ matrix.api }}
        run: |
          args=(--number "emulatorApi=${API%%.*}")
          [ ! -f durability-numbers.txt ] || while IFS= read -r line; do args+=(--number "$line"); done < durability-numbers.txt
          python3 -I scripts/nightly-summary.py --job "device-durability" --gate A5 --status "$JOB_STATUS" --cases durability-cases.json "${args[@]}"
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-summary-device-durability-api${{ matrix.api }}
          path: nightly-summary/
          if-no-files-found: error

  # ---- Add jobs below this line, one ticket at a time, after the PR of ticket 05 has merged. ----
  # Planned (spec "Tickets"): the Lighthouse run (W5).
  # Copy the summary and upload steps of `e2e-delivery`; `python3 -I scripts/nightly-summary.py` documents its flags.

  # Gate R2 on main (ADR-0049 decision 9): the PR job of the same name checks a change; this one catches an advisory that
  # appeared since. An ignore in an osv-scanner.toml expires after 30 days at most, so an expired entry fails here too.
  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          mode: osv
      - run: scripts/osv-scan.sh
      - name: Summary (gate Q2)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 -I scripts/nightly-summary.py --job osv-scan --gate R2 --status "$JOB_STATUS"
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-summary-osv-scan
          path: nightly-summary/
          if-no-files-found: error

  # Gate R3 drift check (ADR-0049 decision 9): the live ruleset for `main` must contain what .github/rulesets/main.json says.
  # The owner applies the file (docs/releases/README.md); until then this job fails with "no ruleset named main".
  # The repository is public, so the job token reads rulesets. A token without admin rights does not see `bypass_actors`;
  # scripts/check_ruleset.py then skips that field.
  ruleset-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Compare the live ruleset with the file
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/rulesets" --paginate --jq '.[] | select(.name == "main" and .target == "branch") | .id' | sed -n 1p)"
          if [ -z "$id" ]; then
            echo "::error::no branch ruleset named main is applied; run the command in docs/releases/README.md"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/rulesets/$id" > live-ruleset.json
          python3 -I scripts/check_ruleset.py drift live-ruleset.json
      - name: Summary (gate Q2)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 -I scripts/nightly-summary.py --job ruleset-drift --gate R3 --status "$JOB_STATUS"
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-summary-ruleset-drift
          path: nightly-summary/
          if-no-files-found: error

  # Gate I2: scripts/simulator-durability-ci.sh runs all seven cases of scripts/simulator-durability.sh on the iOS Simulator.
  # macos-26 has no Docker, so the script starts PostgreSQL (Homebrew) and the server on the host (ADR-0049 amendment, ticket 07).
  ios-durability:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SIMULATOR_DURABILITY_RESULT_JSON: ${{ github.workspace }}/simulator-durability.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app # ADR-0047: the default of macos-26
      - uses: ./.github/actions/toolchain
      - run: echo "JAVA_HOME=$(echo "$PWD"/.tools/jdk-*)" >> "$GITHUB_ENV" # one JDK from scripts/setup-toolchain.sh
      - name: simulator-durability-ci.sh (all cases)
        run: scripts/simulator-durability-ci.sh
      - name: Summary (gate Q2)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 -I scripts/nightly-summary.py --job ios-durability --gate I2 --status "$JOB_STATUS" --cases simulator-durability.json
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-summary-ios-durability
          path: nightly-summary/
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-durability-logs
          path: build/simulator-durability/
          if-no-files-found: ignore

  # Gate B3: perf/ci-slo.sh runs Compose on the runner and 20 req/s x 20 events for 120 s (ADR-0049 amendment, ticket 08).
  # Fails on any bad request or p95 > 2x perf/ci-slo-baseline.json. The baseline is for the runner class in SLO_RUNNER_CLASS:
  # change both when `runs-on` changes, and measure a new baseline with `perf/ci-slo.sh measure`.
  ingest-slo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SLO_RUNNER_CLASS: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: ci-slo.sh
        run: perf/ci-slo.sh
      - name: Summary (gate Q2)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          args=()
          if [ -n "${SLO_P95_MS:-}" ]; then args+=(--number "p95Ms=$SLO_P95_MS"); fi
          python3 -I scripts/nightly-summary.py --job ingest-slo --gate B3 --status "$JOB_STATUS" --cases perf/work/ci-slo/cases.json "${args[@]}"
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-summary-ingest-slo
          path: nightly-summary/
          if-no-files-found: error
      - name: Upload k6 result and Compose logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingest-slo-result
          path: perf/work/ci-slo/
          if-no-files-found: ignore
