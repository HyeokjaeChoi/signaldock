# Issue 54 (ADR-0032): CodeQL advanced setup. It replaces the default setup,
# which cannot build this repo: three Gradle builds sit in sibling folders.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Toolchain
        if: matrix.build-mode == 'manual'
        run: scripts/setup-toolchain.sh
      # Main source sets of the three Gradle builds. ubuntu-latest ships an Android SDK at $ANDROID_HOME.
      # --no-daemon: CodeQL cannot trace a build that an existing daemon runs.
      # --no-build-cache: a cache hit skips compile tasks, and then CodeQL sees no source.
      - name: Build (java-kotlin)
        if: matrix.build-mode == 'manual'
        run: |
          export JAVA_HOME="$PWD/.tools/$(ls .tools | grep '^jdk-')"
          sdk/gradlew -p sdk :sdk-android:assembleRelease :demo:app:assembleDebug --no-daemon --no-build-cache
          server/gradlew -p server classes --no-daemon --no-build-cache
          contract-check/gradlew -p contract-check classes --no-daemon --no-build-cache
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
