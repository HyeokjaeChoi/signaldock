# Issue 54 (ADR-0032): CodeQL advanced setup. It replaces the default setup,
# which cannot build this repo: three Gradle builds sit in sibling folders.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            language: java-kotlin
            build-mode: manual
          - os: ubuntu-latest
            language: javascript-typescript
            build-mode: none
          - os: ubuntu-latest
            language: python
            build-mode: none
          - os: ubuntu-latest
            language: actions
            build-mode: none
          # ADR-0032 (Swift addition): CodeQL traces an xcodebuild of the iOS SDK; Swift needs macOS.
          - os: macos-26
            language: swift
            build-mode: manual
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - name: Toolchain
        if: matrix.language == 'java-kotlin'
        run: scripts/setup-toolchain.sh
      # Main source sets of the three Gradle builds. ubuntu-latest ships an Android SDK at $ANDROID_HOME.
      # --no-daemon: CodeQL cannot trace a build that an existing daemon runs.
      # --no-build-cache: a cache hit skips compile tasks, and then CodeQL sees no source.
      - name: Build (java-kotlin)
        if: matrix.language == 'java-kotlin'
        run: |
          export JAVA_HOME="$PWD/.tools/$(ls .tools | grep '^jdk-')"
          # The CodeQL Kotlin extractor runs inside the compiler. The Gradle default heap of 512 MiB (server) is too small
          # for it (the server persistence module hit "garbage collector is thrashing"), so raise it here only.
          OPTS=(--no-daemon --no-build-cache '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8')
          sdk/gradlew -p sdk :sdk-android:assembleRelease :demo:app:assembleDebug "${OPTS[@]}"
          server/gradlew -p server classes "${OPTS[@]}"
          contract-check/gradlew -p contract-check classes "${OPTS[@]}"
      - name: Select Xcode (swift)
        if: matrix.language == 'swift'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app # ADR-0047: the default of macos-26
      # A fresh -derivedDataPath: a cached build would skip compilation, and then CodeQL sees no source.
      - name: Build (swift)
        if: matrix.language == 'swift'
        run: |
          cd sdk-ios
          xcodebuild build -scheme SignalDock -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/codeql-derived" CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
