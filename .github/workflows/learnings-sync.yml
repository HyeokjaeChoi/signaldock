# Promotes CodeRabbit learnings that a merged PR did not record in docs/review/.
# Opens a PR; it never pushes to main. See AGENTS.md "Code review".
name: learnings-sync

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to scan, for learnings that arrived after merge
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
      !startsWith(github.event.pull_request.head.ref, 'learnings-sync/'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
      - name: Promote learnings
        run: scripts/learnings-sync.sh "$PR" > summary.md
      - name: Open PR
        run: |
          if git diff --quiet -- docs/review; then
            echo "nothing to promote"
            exit 0
          fi
          branch="learnings-sync/pr-$PR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/review
          git commit -m "docs(review): promote CodeRabbit learnings from PR #$PR"
          git push origin "$branch"
          {
            echo "Promotes CodeRabbit learnings from PR #$PR into docs/review/."
            echo
            cat summary.md
            echo
            echo "This PR needs normal review. The wording may need editing."
            echo
            echo "- [ ] Reject these pending learnings in https://app.coderabbit.ai/learnings after merge"
          } > body.md
          gh pr create --base main --head "$branch" \
            --title "docs(review): promote CodeRabbit learnings from PR #$PR" \
            --body-file body.md
