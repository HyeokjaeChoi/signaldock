# Same checks as .githooks/pre-commit. Hooks need a per-clone opt-in;
# this job does not, so agents that skip the hook setup still get caught.
name: repo-rules

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # The freeze checks compare with origin/main; a depth-1 checkout has no such ref.
      - run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - run: scripts/check-repo-rules.sh
      # Pinned shellcheck and actionlint (ADR-0049 D1, D2); `lint` skips the JDK download.
      - uses: ./.github/actions/toolchain
        with:
          mode: lint
      - run: scripts/check-shell-lint.sh
      # Gate R1 (ADR-0049 decision 9): a Renovate config error silently stops all update and security PRs. No argument: the
      # validator then checks .github/renovate.json5 as a repo config (a file argument is read as global config).
      # Renovate keeps the exact version below current (customManagers in .github/renovate.json5).
      - name: renovate-config-validator --strict
        env:
          RENOVATE_VERSION: "44.239.1"
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict
      - run: python3 -I -m unittest discover -s scripts -p 'test_*.py'  # scripts/test_demo_seed.py
      - run: python3 -I -m unittest discover -s perf -p 'test_*.py'  # perf/test_seed.py (seed CSV matches the events columns)

  # Gate R2 (ADR-0049 decision 9): known vulnerabilities in the npm lockfiles and the Gradle verification metadata.
  # The nightly job of the same name rescans `main`, because advisories appear without a code change.
  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          mode: osv
      - run: scripts/osv-scan.sh

  verify-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: scripts/verify-contract.sh
      - if: failure()
        run: echo "::notice::If the log says 'Dependency verification failed', run scripts/update-gradle-verification.sh and commit the changed gradle/verification-metadata.xml files (ADR-0038)."

  # verify-contract evaluates the sdk and server builds (`gradlew help`) and the SDK API dump (ADR-0019).
  # These jobs run their tests, so CI checks what the PR descriptions report.
  sdk-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      # ubuntu-latest ships an Android SDK at $ANDROID_HOME.
      - run: |
          jdks=("$PWD"/.tools/jdk-*)
          export JAVA_HOME="${jdks[0]}"
          sdk/gradlew -p sdk :sdk-android:testDebugUnitTest :demo:feature:shop:testDebugUnitTest :demo:feature:diagnostics:testDebugUnitTest :demo:core:data:testDebugUnitTest --no-daemon
          # Compile only: the `device-test` job runs the instrumented tests on an emulator (ADR-0023).
          sdk/gradlew -p sdk :sdk-android:assembleDebugAndroidTest --no-daemon
      # Coverage ratchet (ADR-0049 gate Q3): line coverage of the JVM unit tests of sdk-android against scripts/coverage-baseline.json.
      # The tests above already ran with JaCoCo on, so this step only writes the report from their results.
      - name: Coverage ratchet
        run: |
          jdks=("$PWD"/.tools/jdk-*)
          export JAVA_HOME="${jdks[0]}"
          sdk/gradlew -p sdk :sdk-android:createDebugUnitTestCoverageReport --no-daemon
          python3 -I scripts/check-coverage.py android sdk/sdk-android/build/reports/coverage/test/debug/report.xml
      # Static analysis of every module of the SDK build (ADR-0049): Android Lint with warnings as errors, and detekt with
      # the ktlint rules. Each module has a baseline that may only shrink (scripts/check-baselines.py, run by `check`).
      - name: Android Lint and detekt
        run: |
          jdks=("$PWD"/.tools/jdk-*)
          export JAVA_HOME="${jdks[0]}"
          sdk/gradlew -p sdk lint detekt --no-daemon
      - if: failure()
        run: echo "::notice::If the log says 'Dependency verification failed', run scripts/update-gradle-verification.sh and commit the changed gradle/verification-metadata.xml files (ADR-0038)."

  # Maven ZIP, then the independent consumer app (R8 release) from the unzipped folder.
  # No emulator: the run on a device is a local verification (README).
  consumer-r8:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: scripts/verify-consumer.sh
      - if: failure()
        run: echo "::notice::If the log says 'Dependency verification failed', run scripts/update-gradle-verification.sh and commit the changed gradle/verification-metadata.xml files (ADR-0038)."

  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      # Testcontainers uses the runner's Docker for PostgreSQL.
      - run: |
          jdks=("$PWD"/.tools/jdk-*)
          export JAVA_HOME="${jdks[0]}"
          cd server && ./gradlew test verifyJooq --no-daemon
      # detekt with the ktlint rules for every server module (ADR-0049). Baselines may only shrink (scripts/check-baselines.py).
      - name: detekt
        run: |
          jdks=("$PWD"/.tools/jdk-*)
          export JAVA_HOME="${jdks[0]}"
          cd server && ./gradlew detekt --no-daemon
      - if: failure()
        run: echo "::notice::If the log says 'Dependency verification failed', run scripts/update-gradle-verification.sh and commit the changed gradle/verification-metadata.xml files (ADR-0038)."

  # The instrumented tests of sdk-android on an emulator (33 start, 16 skip themselves, run 39032066203) (ADR-0023, ADR-0011). The phase classes
  # (DurabilityPhases, MeasurePhases) skip themselves without `-e phase`; their process-boundary runs stay local.
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: |
          jdks=("$PWD"/.tools/jdk-*)
          echo "JAVA_HOME=${jdks[0]}" >> "$GITHUB_ENV"
      # The emulator needs /dev/kvm to be usable by the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Change the key when api-level, target, or arch change.
      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1
      - name: Create AVD and snapshot (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: sdk/gradlew -p sdk :sdk-android:connectedDebugAndroidTest --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-reports
          path: sdk/sdk-android/build/reports/androidTests
          if-no-files-found: ignore
      - if: failure()
        run: echo "::notice::If the log says 'Dependency verification failed', run scripts/update-gradle-verification.sh and commit the changed gradle/verification-metadata.xml files (ADR-0038)."

  # The SDK may add at most the budget to the consumer APK (ADR-0023). No emulator.
  size-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: scripts/check-size-budget.sh
      - if: failure()
        run: echo "::notice::If the log says 'Dependency verification failed', run scripts/update-gradle-verification.sh and commit the changed gradle/verification-metadata.xml files (ADR-0038)."

  # iOS SDK gates (ADR-0047 D13; commands in scripts/verify-ios.sh). macos-26 has no iOS 15 Simulator runtime, so the
  # tests run on the oldest installed runtime (ADR-0047 "iOS 15 Simulator fallback"). The log lists the runtimes.
  # Warnings are errors in CI only (IOS_WERROR).
  ios-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      IOS_WERROR: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app # ADR-0047: the default of macos-26
      - run: scripts/verify-ios.sh lint
      - run: scripts/verify-ios.sh tsan
      # Coverage ratchet (ADR-0049 gate Q3), read from the result bundle of the tsan run; the Xcode of this job is the source of truth.
      - run: scripts/verify-ios.sh coverage
      - run: scripts/verify-ios.sh analyze
      - run: scripts/verify-ios.sh manifest
      # Public API against sdk-ios/api/SignalDock.swiftinterface (ADR-0047 D13 item 7). The compiler of this job is the
      # source of truth (sdk-ios/api/compiler-version). On a mismatch the job fails and uploads the actual interface;
      # take it with `scripts/verify-ios.sh api-update <downloaded directory>`.
      - run: scripts/verify-ios.sh api
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-actual
          path: sdk-ios/build/api-actual
          if-no-files-found: ignore

  # A separate run with ASan and UBSan; TSan cannot be combined with them.
  ios-sanitize:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      IOS_WERROR: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app # ADR-0047: the default of macos-26
      - run: scripts/verify-ios.sh asan

  # The independent iOS consumer app (ADR-0047 D12, D13 item 9): a fresh release ZIP is unzipped and compatibility/consumer-ios
  # builds in Debug and Release for the Simulator from that folder only. The iOS form of `consumer-r8`. No Simulator run.
  ios-consumer:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      IOS_WERROR: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app # ADR-0047: the default of macos-26
      - run: scripts/verify-consumer-ios.sh

  # The iOS SDK may add at most the budget to the consumer Release build (ADR-0047 amendment "ticket 17, size budget"; the iOS
  # form of `size-budget`). Archive size only, no Simulator. The log prints both deltas and the budgets.
  ios-size-budget:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app # ADR-0047: the default of macos-26
      - run: scripts/check-ios-size-budget.sh

  # Checks every gradle-wrapper.jar in the checkout (sdk, server, contract-check, compatibility/consumer-android)
  # against Gradle's published checksums. A changed or unknown wrapper jar fails the job. Pinned by commit SHA (ADR-0024 item 4).
  gradle-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
