# Same checks as .githooks/pre-commit. Hooks need a per-clone opt-in;
# this job does not, so agents that skip the hook setup still get caught.
name: repo-rules

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: scripts/check-repo-rules.sh
