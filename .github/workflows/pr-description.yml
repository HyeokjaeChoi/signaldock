# CodeRabbit reads only about the first 3,800 characters of a PR description,
# so longer descriptions make its pre-merge checks inconclusive (PR #9, #11, #12).
# Put details in ADRs and issue files and link them.
name: pr-description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  length:
    runs-on: ubuntu-latest
    steps:
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          len=$(printf '%s' "$BODY" | wc -m)
          echo "PR description: $len characters (limit 3500)"
          [ "$len" -le 3500 ] || { echo "::error::PR description has $len characters. Keep it at 3500 or less; move details to ADRs or issue files."; exit 1; }
