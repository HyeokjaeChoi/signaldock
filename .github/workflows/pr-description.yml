# Reviewers read long PR descriptions badly: CodeRabbit read only about the first 3,800
# characters, so its pre-merge checks were inconclusive (PR #9, #11, #12).
# Put details in ADRs and issue files and link them.
name: pr-description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  length:
    # Dependabot and Renovate write release notes into the body; nothing reads them as a design record.
    if: github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          len=$(printf '%s' "$BODY" | LC_ALL=C.UTF-8 wc -m)
          echo "PR description: $len characters (limit 3500)"
          [ "$len" -le 3500 ] || { echo "::error::PR description has $len characters. Keep it at 3500 or less; move details to ADRs or issue files."; exit 1; }
