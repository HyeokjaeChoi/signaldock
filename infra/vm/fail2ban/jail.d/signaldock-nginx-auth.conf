# 5 bad logins in 10 minutes: ban the IP for 1 hour on ports 80 and 443 (default banaction on Ubuntu 24.04: nftables).
# The Dashboard password is a random value, so this is noise control, not the main defence. A short ban means
# the owner who mistypes is back within the hour. No recidive jail: the demo ends in 12 weeks.
# backend = auto: the Ubuntu default (systemd) cannot read a log file.
[signaldock-nginx-auth]
enabled  = true
backend  = auto
filter   = signaldock-nginx-auth
logpath  = /var/log/nginx/signaldock.json
port     = http,https
maxretry = 5
findtime = 10m
bantime  = 1h

# Ubuntu's defaults-debian.conf turns on the sshd jail. Port 22 is open only to the IAP range
# (35.235.240.0/20), so every SSH client address is an IAP forwarder: a ban would lock the owner out.
# This file sorts after defaults-debian.conf, so this setting wins.
[sshd]
enabled = false
