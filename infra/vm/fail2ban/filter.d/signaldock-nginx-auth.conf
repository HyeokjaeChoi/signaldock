# Basic-auth failures in the host nginx JSON access log (ADR-0045 item 8, ticket 07).
# A match is: status 401, a user name was sent (bad credentials; a plain challenge has an empty remote_user),
# and the route is not one of the two ingest routes. Ingest routes have auth_basic off, so a 401 there comes
# from the server (bad collection key) and must not ban SDK callers.
# remote_addr is the first field and the pattern is anchored at the line start. The request-controlled fields
# (user, uri) are JSON-escaped by nginx, so a request cannot forge another address or status.
[Definition]
failregex = ^\{"time":"[^"]*","remote_addr":"<HOST>","remote_user":"(?:[^"\\]|\\.)+","method":"[^"]*","uri":"(?!/v1/events:batch"|/v1/client-reports")(?:[^"\\]|\\.)*","protocol":"[^"]*","status":401,
ignoreregex =
