# Host nginx for the cloud demo (ADR-0044 items 1, 2, 5). Installed as /etc/nginx/conf.d/signaldock.conf.
# Written for Ubuntu 24.04 nginx 1.24 (no `http2 on;`, which needs 1.25.1).
#
# Default is basic auth. Exactly four routes are open, each by an exact-match location that
# allows one method only. Any other method on them is 403 and never reaches an upstream.
#   POST /v1/events:batch, POST /v1/client-reports   -> server 127.0.0.1:8080 (collection key + per-IP limits)
#   GET /ready                                       -> server (uptime check)
#   GET /deployed.txt                                -> file written by the deploy (tag only)
# /reports/ (GoAccess static report, ticket 07) is behind basic auth like the Dashboard.
# `/` and every GET /v1/* query route go to the Dashboard 127.0.0.1:5173, which adds the query key itself
# (dashboard/nginx.conf.template). The browser never sees that key and host nginx never sends it.

# Access log: JSON, no query string ($uri, not $request_uri or $request), no Authorization header.
log_format signaldock escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","remote_user":"$remote_user",'
  '"method":"$request_method","uri":"$uri","protocol":"$server_protocol","status":$status,'
  '"bytes":$body_bytes_sent,"request_length":$request_length,"request_time":$request_time,'
  '"limit_req":"$limit_req_status","host":"$host","referer":"$http_referer","user_agent":"$http_user_agent"}';

# Per-IP limits for the two ingest routes (one shared budget). 5 requests a second, burst 10, 10 connections.
limit_req_zone  $binary_remote_addr zone=signaldock_ingest:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=signaldock_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Any host name or IP that is not ours: no TLS handshake, no response.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    access_log off;
    return 444;
}

server {
    listen 80;
    server_name signaldock.stack-line.dev;
    access_log /var/log/nginx/signaldock.json signaldock;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name signaldock.stack-line.dev;

    ssl_certificate     /etc/letsencrypt/live/signaldock.stack-line.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signaldock.stack-line.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log /var/log/nginx/signaldock.json signaldock;

    server_tokens off;
    client_max_body_size 256k;  # the server batch limit is 262144 bytes (Application.kt)

    auth_basic           "SignalDock demo";
    auth_basic_user_file /etc/nginx/signaldock.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;  # nothing in front of us: do not trust a client-sent value
    proxy_set_header X-Forwarded-Proto $scheme;

    # Over a limit: 429, JSON body, Retry-After.
    error_page 429 @too_many_requests;
    location @too_many_requests {
        auth_basic off;  # never turn a rate-limit 429 into a 401 (the SDK treats 401 as a config error)
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":"too_many_requests"}\n';
    }

    location = /v1/events:batch {
        auth_basic off;
        limit_except POST { deny all; }
        limit_req  zone=signaldock_ingest burst=10 nodelay;
        limit_conn signaldock_conn 10;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /v1/client-reports {
        auth_basic off;
        limit_except POST { deny all; }
        client_max_body_size 4k;  # the server client report limit is 4096 bytes
        limit_req  zone=signaldock_ingest burst=10 nodelay;
        limit_conn signaldock_conn 10;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /ready {
        auth_basic off;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
    }

    location = /deployed.txt {
        auth_basic off;
        limit_except GET { deny all; }
        root /var/www/signaldock;
        default_type text/plain;
        add_header Cache-Control no-store always;
    }

    # GoAccess report (signaldock-report.timer writes the file). Basic auth from the server block.
    location = /reports { return 301 /reports/; }
    location /reports/ {
        limit_except GET { deny all; }
        alias /var/www/signaldock-reports/;
        index index.html;
        add_header Cache-Control no-store always;
    }

    # Dashboard and GET /v1/* query routes: basic auth from the server block.
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_read_timeout 30s;
    }
}
