<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalDock server load report</title>
    <!-- Theme before the first paint (ADR-0016). Same key as web-shared/theme/theme.ts; dark is the default. -->
    <script>try{if(localStorage.getItem("signaldock.theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Classic scripts so the page also opens from file://. index.js is written next to this file by `npm run build`. -->
    <script src="./index.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
