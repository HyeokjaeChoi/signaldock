[versions]
# Toolchain (verified by build in issue #1 unless noted)
jdk = "17"
gradle = "8.14.5"
agp = "8.13.2"
kotlin = "2.4.21"
kotlinx-serialization = "1.11.0"
openapi-generator = "7.26.0"
oasdiff = "1.33.0"

# KSP has no 2.4.x release as of 2026-10-09 (latest is 2.3.12; KSP 2.3+ is
# versioned independently of Kotlin). Pinned in issue 03 and verified with
# Kotlin 2.4.21 + Room 2.8.5 (see docs/adr/0003-sdk-storage-decisions.md).
ksp = "2.3.12"

# Android (doc-pinned; full AGP compilation verified in later issues)
compileSdk = "36"
minSdk = "24"
targetSdk = "36"
room = "2.8.5"
workmanager = "2.12.0"
retrofit = "3.0.0"
okhttp = "5.5.0"
compose-bom = "2026.09.00"
coroutines = "1.11.0"
# SDK JVM tests (no emulator)
robolectric = "4.17"
junit = "4.13.2"
androidx-test-core = "1.7.0"

# Server (doc-pinned; server build verified in issue #2)
ktor = "3.6.0"
jooq = "3.19.39"
flyway = "13.10.0"
hikari = "7.0.2"
postgresql = "42.7.8"
testcontainers = "2.0.5"
slf4j = "2.0.17"

# Dashboard (doc-pinned; TS compile of generated models verified in issue #1)
typescript = "7.0.2"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-codegen = { module = "org.jooq:jooq-codegen", version.ref = "jooq" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-library = { id = "com.android.library", version.ref = "agp" }
