[versions]
# Toolchain (verified by build in issue #1 unless noted)
jdk = "21"
gradle = "9.7.0"
agp = "9.3.3"
kotlin = "2.4.21"
kotlinx-serialization = "1.11.0"
openapi-generator = "7.26.0"
oasdiff = "1.33.0"

# KSP has no 2.4.x release as of 2026-10-09 (latest is 2.3.12; KSP 2.3+ is
# versioned independently of Kotlin). Pinned in issue 03 and verified with
# Kotlin 2.4.21 + Room 2.8.5 (see docs/adr/0003-sdk-storage-decisions.md).
ksp = "2.3.12"

# Public API check (issue 35, ADR-0019). The Kotlin built-in abiValidation dumps nothing for an AGP library.
binary-compatibility-validator = "0.18.2"

# Android (doc-pinned; full AGP compilation verified in later issues)
compileSdk = "36"
minSdk = "24"
targetSdk = "36"
room = "2.8.5"
workmanager = "2.12.0"
retrofit = "3.0.0"
# 5.5.0 AAR requires compileSdk 37; 5.4.0 builds at 36 (ADR-0006 decision 1).
okhttp = "5.4.0"
compose-bom = "2026.09.00"
# Demo app only (issue 16, ADR-0006 decision 1). The demo keeps targetSdk 36 (Play requirement, no API 37 deadline).
# Versions below: latest stable on Google Maven, 2026-10-12.
demo-compileSdk = "37"
androidx-activity = "1.12.4"
androidx-lifecycle = "2.10.0"
androidx-navigation = "2.10.2"
coroutines = "1.11.0"
# SDK JVM tests (no emulator)
robolectric = "4.17"
junit = "4.13.2"
androidx-test-core = "1.7.0"
# Instrumented tests on emulators (issue 20, ADR-0011). Latest stable on Google Maven, 2026-10-12.
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"

# Server (doc-pinned; server build verified in issue #2)
ktor = "3.6.0"
jooq = "3.21.9"
flyway = "13.10.0"
hikari = "7.0.2"
postgresql = "42.7.8"
testcontainers = "2.0.5"
slf4j = "2.0.17"

# Dashboard (doc-pinned; TS compile of generated models verified in issue #1)
typescript = "7.0.2"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "workmanager" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "workmanager" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-codegen = { module = "org.jooq:jooq-codegen", version.ref = "jooq" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-library = { id = "com.android.library", version.ref = "agp" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
