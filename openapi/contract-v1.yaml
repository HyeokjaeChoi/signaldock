openapi: 3.0.3
info:
  title: SignalDock API
  version: 1.0.0
  description: |
    Contract version 1 of the SignalDock event ingestion API and the
    Dashboard query API.
    The transport contract version travels in the required
    `SignalDock-Contract-Version` header, separately from the SDK
    release version. This document is the contract source; Kotlin
    (SDK/server) and TypeScript (Dashboard) models are generated
    from it. Generated sources are tracked in Git (Q91).
paths:
  /v1/events:batch:
    post:
      operationId: ingestEventBatch
      summary: Ingest a batch of business events
      security:
        - collectionKey: []
      parameters:
        - name: SignalDock-Contract-Version
          in: header
          required: true
          schema:
            type: string
            enum: ["1"]
          description: >
            Transport contract version (Q65, Q106). A missing header is
            rejected with HTTP 400 and nothing is stored (Q105).
        - name: Content-Encoding
          in: header
          required: false
          schema:
            type: string
            enum: [identity]
          description: >
            The request body must be unencoded. Omit this header or send
            `identity`; other content encodings are rejected with HTTP 415.
      requestBody:
        required: true
        description: >
          JSON is the only supported request media type. Other Content-Type
          values are rejected with HTTP 415.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIngestRequest'
      responses:
        '200':
          description: >
            Batch receipt result. Every request item appears exactly once
            with its index and status (Q59). The SDK validates the whole
            response against the immutable request-time list before applying it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAckResponse'
        '400':
          description: >
            Rejected in full: missing contract header, unsupported contract
            version, a missing or mismatched item contractVersion, unknown
            fields, or malformed request. Nothing is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            The Bearer collection key is missing, repeated, malformed, or
            invalid. Nothing is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: >
            Batch or single event exceeds the size contract (Q60).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: >
            The request Content-Type is not application/json, or its
            Content-Encoding is not identity. Nothing is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >
            Retryable temporary failure. The client keeps the same event IDs
            because the storage outcome can be uncertain.
          headers:
            Retry-After:
              description: Positive delay in seconds before the next retry.
              schema:
                type: string
                pattern: '^[1-9][0-9]*$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/events:
    get:
      operationId: listReceivedEvents
      summary: List received events, newest first by default
      description: >
        Keyset-paginated list of stored events filtered by receivedAt in
        [from, to). Rows are ordered by (receivedAt, eventId). The cursor is
        not a snapshot: one traversal can miss concurrent inserts or late
        commits. Request parameters are strict: unknown or repeated
        parameters are rejected with HTTP 400.
      security:
        - queryKey: []
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/NameFilter'
        - $ref: '#/components/parameters/InstallationIdFilter'
        - $ref: '#/components/parameters/EventIdFilter'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [receivedAt_desc, receivedAt_asc]
            default: receivedAt_desc
          description: Order by receivedAt, then eventId in the same direction.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >
            Opaque `nextCursor` from a previous page. It is valid only with
            the same `sort`.
      responses:
        '200':
          description: One page of received events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceiptPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{eventId}:
    get:
      operationId: getReceivedEvent
      summary: Get one received event with its stored properties
      security:
        - queryKey: []
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The stored event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceiptDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No stored event has this ID (code EVENT_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/event-counts/by-name:
    get:
      operationId: countReceivedEventsByName
      summary: Count received events by event name
      description: >
        COUNT / GROUP BY over stored rows with receivedAt in [from, to) and
        the same filters as the list. At most 100 names are returned, largest
        count first, then by name; `truncated` tells whether more exist.
      security:
        - queryKey: []
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/NameFilter'
        - $ref: '#/components/parameters/InstallationIdFilter'
        - $ref: '#/components/parameters/EventIdFilter'
      responses:
        '200':
          description: Counts by event name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventNameCounts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/event-counts/by-time:
    get:
      operationId: countReceivedEventsByTime
      summary: Count received events by receivedAt time bucket
      description: >
        COUNT / GROUP BY over stored rows with receivedAt in [from, to) and
        the same filters as the list. Buckets start at project timezone hour
        or day boundaries. Empty buckets inside the range are returned with
        count 0. At most 720 buckets: a request that produces more than 720
        buckets returns 400 PERIOD_TOO_LONG.
      security:
        - queryKey: []
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/NameFilter'
        - $ref: '#/components/parameters/InstallationIdFilter'
        - $ref: '#/components/parameters/EventIdFilter'
        - name: bucket
          in: query
          required: false
          schema:
            type: string
            enum: [hour, day]
          description: >
            Bucket size. Default: `hour` when the range touches one calendar
            date in the project timezone, otherwise `day`.
      responses:
        '200':
          description: Counts by time bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTimeCounts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  parameters:
    ContractVersion:
      name: SignalDock-Contract-Version
      in: header
      required: true
      schema:
        type: string
        enum: ["1"]
      description: >
        Transport contract version (Q65, Q106, Q107). A missing or
        unsupported value is rejected with HTTP 400.
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: >
        Inclusive start of the receivedAt period. RFC 3339 with an offset;
        values not representable in milliseconds are rejected (Q83).
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: >
        Exclusive end of the receivedAt period, after `from`. The period may
        touch at most 30 calendar dates in the project timezone. It is not
        truncated silently; a longer period is rejected.
    NameFilter:
      name: name
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Exact event name. No trimming or normalization (Q64, Q84).
    InstallationIdFilter:
      name: installationId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Exact installation ID.
    EventIdFilter:
      name: eventId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Exact event ID.
  responses:
    BadRequest:
      description: >
        Rejected: missing or unsupported contract version, or an unknown,
        repeated, or invalid request parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: >
        The Bearer query key is missing, repeated, malformed, or invalid, or the
        value is another key. The code is QUERY_KEY_INVALID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Retryable temporary failure. Retry later without changing the request.
      headers:
        Retry-After:
          description: Positive delay in seconds before the next retry.
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    collectionKey:
      type: http
      scheme: bearer
      description: >
        Collection key used for local evaluation. This is an access check,
        not end-user authentication or a public-service security boundary.
        It is write-only: only ingestion accepts it. Apps can expose it.
    queryKey:
      type: http
      scheme: bearer
      description: >
        Query key used for local evaluation. The Dashboard reads stored
        events with it through a same-origin proxy. This is an access check,
        not end-user authentication or a public-service security boundary.
        Only the query endpoints accept it. A missing, wrong, or collection
        key returns 401 QUERY_KEY_INVALID.
  schemas:
    BatchIngestRequest:
      type: object
      additionalProperties: false
      required: [installationId, events]
      properties:
        installationId:
          type: string
          description: Installation ID shared by events from one app installation.
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventIngest'
          minItems: 1
    EventIngest:
      type: object
      required: [eventId, name, occurredAt, properties, sdkVersion, contractVersion]
      properties:
        eventId:
          type: string
          description: >
            Event ID. Unchanged across resends; the server uses it with
            content comparison for duplicate detection (Q69).
        name:
          type: string
          description: >
            Business event name defined by the client app. Leading or trailing whitespace, or an empty or
            whitespace-only value, is rejected; internal whitespace is kept.
            Whitespace is exactly U+0009..U+000D, U+0020, U+0085, U+00A0,
            U+1680, U+2000..U+200A, U+2028, U+2029, U+202F, U+205F, U+3000
            (Q64; fixtures/validation/whitespace-set.json). Other characters,
            such as U+001C, U+180E, U+200B, and U+FEFF, are not whitespace.
        occurredAt:
          type: string
          format: date-time
          description: >
            UTC RFC 3339 timestamp with millisecond precision (Q81).
            Numeric offsets are accepted and interpreted as the same UTC
            instant (Q82); local times without offsets are rejected.
            Values not representable in milliseconds are rejected (Q83).
        properties:
          type: object
          description: >
            Flat event properties. Keys map to scalar string, number, or
            boolean values only; no null values and no nesting (Q33-35).
            Keys follow the event name whitespace rule: no leading or trailing
            whitespace, not empty or whitespace-only. The whitespace set is
            U+0009..U+000D, U+0020, U+0085, U+00A0, U+1680, U+2000..U+200A,
            U+2028, U+2029, U+202F, U+205F, U+3000 (Q64;
            fixtures/validation/whitespace-set.json).
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        sdkVersion:
          type: string
          description: SDK release version at collection time, kept unchanged on resend (Q66).
        contractVersion:
          type: string
          enum: ["1"]
          description: Transport contract version stored with the queue entry (Q66).
      additionalProperties: false
    BatchAckResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One result per request item, each index exactly once.
          items:
            $ref: '#/components/schemas/ItemAck'
    ItemAck:
      type: object
      required: [index, status]
      properties:
        index:
          type: integer
          minimum: 0
          description: Zero-based index into the request events array.
        status:
          type: string
          enum: [accepted, duplicate, rejected]
          description: >
            Per-item receipt status. `duplicate` also covers resends of an
            already stored event (Q69). `rejected` is a permanent,
            per-event rejection.
        eventId:
          type: string
          description: Event ID echoed. Present for valid IDs.
        code:
          type: string
          description: Machine-readable reason for `rejected` items.
        message:
          type: string
          description: Human-readable detail for `rejected` items.
    PropertyValue:
      oneOf:
        - type: string
        - type: number
        - type: boolean
    EventReceiptSummary:
      type: object
      required: [eventId, installationId, name, occurredAt, receivedAt, sdkVersion]
      properties:
        eventId:
          type: string
        installationId:
          type: string
        name:
          type: string
        occurredAt:
          type: string
          description: Client time as stored. UTC RFC 3339 with milliseconds.
        receivedAt:
          type: string
          description: Server receipt time. UTC RFC 3339 with milliseconds.
        sdkVersion:
          type: string
          description: SDK release version at collection time.
    EventReceiptPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventReceiptSummary'
        nextCursor:
          type: string
          description: Present only when another page may exist.
    EventReceiptDetail:
      type: object
      required: [eventId, installationId, name, occurredAt, receivedAt, sdkVersion, properties]
      properties:
        eventId:
          type: string
        installationId:
          type: string
        name:
          type: string
        occurredAt:
          type: string
          description: Client time as stored. UTC RFC 3339 with milliseconds.
        receivedAt:
          type: string
          description: Server receipt time. UTC RFC 3339 with milliseconds.
        sdkVersion:
          type: string
        properties:
          type: object
          description: >
            Stored properties. Values passed through JSONB, so this is not
            the original HTTP payload and key order is not preserved.
          additionalProperties:
            $ref: '#/components/schemas/PropertyValue'
    EventNameCount:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
          format: int64
    EventNameCounts:
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventNameCount'
        truncated:
          type: boolean
          description: True when more than 100 names matched.
    EventTimeBucket:
      type: object
      required: [start, count]
      properties:
        start:
          type: string
          description: Bucket start instant. UTC RFC 3339 with milliseconds.
        count:
          type: integer
          format: int64
    EventTimeCounts:
      type: object
      required: [timeZone, bucket, items]
      properties:
        timeZone:
          type: string
          description: Project timezone used for bucket boundaries, e.g. Asia/Seoul.
        bucket:
          type: string
          enum: [hour, day]
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventTimeBucket'
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Machine-readable error code, e.g. CONTRACT_HEADER_MISSING,
            CONTRACT_VERSION_UNSUPPORTED, COLLECTION_KEY_INVALID,
            QUERY_KEY_INVALID, UNKNOWN_FIELD, MALFORMED_REQUEST,
            INVALID_PARAMETER, INVALID_CURSOR, PERIOD_TOO_LONG, EVENT_NOT_FOUND.
        message:
          type: string
