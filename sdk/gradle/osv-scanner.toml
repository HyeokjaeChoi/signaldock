# OSV-Scanner ignores for sdk/gradle/verification-metadata.xml (ADR-0049 decision 9, gate R2). Run: scripts/osv-scan.sh.
# scripts/osv-scan.sh passes the nearest osv-scanner.toml to each lockfile, so an ignore here covers only this file.
# Each entry needs a `reason` and an `ignoreUntil` at most 30 days after the day it is written;
# scripts/check-repo-rules.sh fails otherwise, and it rejects every table except [[IgnoredVulns]]
# (no package-wide override). When a date passes, the finding fails the PR and the nightly run again:
# fix it (update the dependency) or renew the entry in a PR that says why.
# Triage 2026-11-16 (issue 15): stale entries pruned from verification-metadata.xml. Each entry below is still
# listed in that file, and no stable release of the tool that pulls it has the fixed version yet.
# Renew an entry only if its reason is still true.
# The okio entry is only a .module file; see its reason.
# Renew only if the reason is still true.

# guava: Google Guava: CompactHashMap/CompactHashSet/MapMakerInternalMap deserialization
[[IgnoredVulns]]
id = "GHSA-xxph-c9ww-hj94"
ignoreUntil = 2026-12-16
reason = "Guava 33.4.0 (AGP 9.4.1 plugin classpath), 33.2.1 (Room 2.8.5 KSP processor) and 33.6.0 (Robolectric 4.17, JVM unit tests). Build and test tools only, not in sdk/sdk-android/dependencies/. The flaw needs Java deserialization of untrusted data; these tools read only repo sources."

